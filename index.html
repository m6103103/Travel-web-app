<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅遊助手 - 旗艦智慧優化版</title>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti 特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            'bg': '#F2F2F7',
                            'primary': '#007AFF',
                            'text': '#1C1C1E',
                            'success': '#34C759',
                            'danger': '#FF3B30',
                            'warning': '#FF9500'
                        }
                    },
                    borderRadius: { 'ios': '20px' }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none !important; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .tab-bar { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .date-chip-active { background-color: #007AFF; color: white; transform: scale(1.05); }
        .wizard-enter-active, .wizard-leave-active { transition: all 0.5s ease; }
        .wizard-enter-from, .wizard-leave-to { opacity: 0; transform: translateY(20px); }
        .slide-up-enter-active, .slide-up-leave-active { transition: transform 0.3s ease-out; }
        .slide-up-enter-from, .slide-up-leave-to { transform: translateY(100%); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .rounded-ios { border-radius: 20px !important; }
        
        /* 啟動載入器 */
        #startup-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F2F2F7; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- Vue 尚未掛載前的 Loading 畫面 -->
    <div id="startup-loader">
        <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-xs font-bold text-gray-400">正在準備您的旅程...</p>
    </div>

    <div id="app" v-cloak class="h-screen w-full relative overflow-hidden flex flex-col">
        
        <!-- 雲端同步動畫層 -->
        <div v-if="loading" class="fixed inset-0 z-[1000] bg-white flex flex-col items-center justify-center">
            <div class="w-10 h-10 border-4 border-theme-primary border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-xs font-bold text-gray-400">正在同步雲端資料...</p>
        </div>

        <!-- 初始設定精靈 -->
        <transition name="wizard">
            <div v-if="showWizard && !loading" class="fixed inset-0 z-[999] bg-white flex flex-col">
                <div class="pt-16 px-8 pb-4">
                    <h1 class="text-3xl font-black text-theme-text mb-2">建立新旅程</h1>
                    <p class="text-gray-400 text-sm font-bold">輸入目的地將智慧偵測幣值與匯率。</p>
                </div>

                <div class="flex-grow overflow-y-auto px-8 py-4 space-y-6 hide-scrollbar">
                    <div class="space-y-4">
                        <label class="block text-xs font-black text-theme-primary uppercase tracking-wider">Step 1 · 目的地偵測</label>
                        <div class="bg-gray-50 p-1 rounded-ios border-2 border-transparent focus-within:border-theme-primary/30 transition-colors">
                            <input v-model="wizardData.destination" @input="detectLocationInfo" type="text" placeholder="城市或國家 (如: 大阪, 首爾, 巴黎)" class="w-full bg-transparent p-4 font-bold text-lg placeholder-gray-300 outline-none">
                        </div>
                        
                        <div v-if="wizardData.detectedCountry" class="bg-blue-50 p-4 rounded-ios border border-blue-100 flex items-center space-x-3">
                            <div class="text-3xl">{{ wizardData.flag }}</div>
                            <div class="flex-grow">
                                <p class="text-[10px] text-gray-400 font-bold uppercase">智慧偵測</p>
                                <p class="text-sm font-black text-theme-text">{{ wizardData.detectedCountry }}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-gray-400 font-bold">匯率估計 (1 外幣 = )</p>
                                <p class="text-sm font-black text-theme-primary">NT$ {{ wizardData.rate }}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 block mb-1">開始日期</label>
                                <input v-model="wizardData.startDate" type="date" class="w-full bg-gray-50 p-3 rounded-ios font-bold text-sm outline-none">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 block mb-1">結束日期</label>
                                <input v-model="wizardData.endDate" type="date" class="w-full bg-gray-50 p-3 rounded-ios font-bold text-sm outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <label class="block text-xs font-black text-theme-primary uppercase tracking-wider">Step 2 · 旅伴名單</label>
                        <div class="bg-white rounded-ios shadow-sm border border-gray-100 overflow-hidden">
                            <div v-for="(person, idx) in wizardData.travelers" :key="idx" class="flex items-center border-b border-gray-50 last:border-none p-2">
                                <div :class="['w-10 h-10 rounded-full flex items-center justify-center text-white text-xs font-black mr-3', getColorClass(idx)]">
                                    {{ wizardData.travelers[idx].charAt(0).toUpperCase() || '?' }}
                                </div>
                                <input v-model="wizardData.travelers[idx]" type="text" placeholder="輸入姓名" class="flex-grow font-bold py-2 bg-transparent outline-none">
                                <button v-if="wizardData.travelers.length > 1" @click="wizardData.travelers.splice(idx, 1)" class="w-8 h-8 text-gray-300 hover:text-red-500">
                                    <i class="fa-solid fa-circle-minus"></i>
                                </button>
                            </div>
                            <button @click="wizardData.travelers.push('')" class="w-full py-4 text-xs font-black text-theme-primary bg-gray-50 flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-user-plus"></i>
                                <span>新增旅伴</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="p-8 border-t border-gray-100 bg-white pb-safe">
                    <button @click="saveWizardSettings" :disabled="!isWizardValid" :class="['w-full py-5 rounded-ios font-black text-white shadow-lg transition-all', isWizardValid ? 'bg-theme-primary' : 'bg-gray-300 cursor-not-allowed opacity-50']">
                        開始旅程
                    </button>
                </div>
            </div>
        </transition>

        <!-- 主界面 -->
        <template v-if="!showWizard && !loading">
            <main class="flex-grow relative z-10 overflow-hidden flex flex-col">
                <!-- 行程規劃 -->
                <section v-if="activeTab === 'itinerary'" class="h-full flex flex-col bg-theme-bg relative">
                    <div class="pt-14 pb-4 bg-white shadow-sm z-20">
                        <div class="px-6 flex justify-between items-center mb-4">
                            <div>
                                <h2 class="text-xl font-black text-theme-text">{{ tripConfig.destination }}</h2>
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">{{ tripConfig.flag }} 第 {{ currentDayIndex + 1 }} 天</p>
                            </div>
                            <button @click="showAddEvent = true" class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-theme-primary">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div class="flex space-x-3 overflow-x-auto px-6 pb-2 hide-scrollbar">
                            <button v-for="day in dateSequence" :key="day.dateStr" 
                                    @click="selectedDateStr = day.dateStr"
                                    :class="['flex-shrink-0 w-14 h-16 rounded-ios flex flex-col items-center justify-center transition-all', selectedDateStr === day.dateStr ? 'date-chip-active shadow-md' : 'bg-gray-50 text-gray-400']">
                                <span class="text-[9px] font-black uppercase mb-1">{{ day.weekday }}</span>
                                <span class="text-base font-black">{{ day.dayNum }}</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto hide-scrollbar px-6 pt-4 pb-32">
                        <div v-for="(item, idx) in filteredItinerary" :key="item.id" class="relative pl-11 py-1 mb-4">
                            <div class="absolute left-0 w-8 h-8 rounded-full bg-white shadow-sm border-2 border-theme-primary flex items-center justify-center text-[10px] font-black text-theme-primary translate-y-3 z-10">{{ idx + 1 }}</div>
                            <div class="p-5 rounded-ios bg-white shadow-sm flex justify-between items-start">
                                <div @click="openGoogleMap(item.location)" class="cursor-pointer">
                                    <span class="text-[10px] font-black text-theme-primary uppercase">{{ item.time }}</span>
                                    <h4 class="font-bold text-theme-text text-base leading-tight">{{ item.location }}</h4>
                                </div>
                                <button @click="deleteEvent(item.id)" class="text-gray-200 pt-1"><i class="fa-solid fa-circle-xmark"></i></button>
                            </div>
                        </div>
                        <div v-if="filteredItinerary.length === 0" class="text-center py-20 opacity-20">
                            <i class="fa-solid fa-map-pin text-4xl mb-2"></i>
                            <p class="text-xs font-black">今日無行程</p>
                        </div>
                    </div>
                </section>

                <!-- 分帳結算 -->
                <section v-if="activeTab === 'split'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm flex justify-between items-center">
                        <h2 class="text-2xl font-black text-theme-text">結算中心</h2>
                        <button @click="showAddExpense = true" class="px-4 py-2 bg-theme-primary text-white rounded-full text-[10px] font-black">+ 記帳</button>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto p-6 hide-scrollbar pb-32">
                        <!-- 總覽 -->
                        <div class="bg-theme-text p-6 rounded-ios shadow-lg mb-6 text-white">
                            <p class="text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-widest">總計支出 ({{ tripConfig.currency }})</p>
                            <h3 class="text-3xl font-black">{{ tripConfig.currency }} {{ (totalExpenseAmount || 0).toLocaleString() }}</h3>
                            <div class="mt-4 pt-4 border-t border-white/10 flex justify-between">
                                <div>
                                    <p class="text-[9px] text-gray-400">折合台幣</p>
                                    <p class="text-sm font-black text-theme-success">NT$ {{ Math.round((totalExpenseAmount || 0) * (tripConfig.rate || 1)).toLocaleString() }}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] text-gray-400">當前匯率</p>
                                    <p class="text-xs font-bold">{{ tripConfig.rate || 1 }} TWD</p>
                                </div>
                            </div>
                        </div>

                        <!-- 各人餘額 -->
                        <div class="mb-6">
                            <h3 class="text-[11px] font-black text-gray-400 uppercase tracking-widest mb-3 px-1">收支平衡 (NT$)</h3>
                            <div class="bg-white rounded-ios shadow-sm divide-y divide-gray-50 overflow-hidden">
                                <div v-for="(bal, name) in balances" :key="name" class="p-4 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div :class="['w-8 h-8 rounded-full flex items-center justify-center text-white text-[10px] font-black', getColorClassByName(name)]">
                                            {{ name.charAt(0).toUpperCase() }}
                                        </div>
                                        <span class="text-xs font-bold text-theme-text">{{ name }}</span>
                                    </div>
                                    <div class="text-right">
                                        <p :class="['text-xs font-black', bal >= 0 ? 'text-theme-success' : 'text-theme-danger']">
                                            {{ bal >= 0 ? '+' : '' }}{{ Math.round(bal * (tripConfig.rate || 1)) }}
                                        </p>
                                        <p class="text-[9px] text-gray-300">{{ bal >= 0 ? '應收' : '應付' }}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 歷史清單 -->
                        <div v-for="ex in expenses" :key="ex.id" class="bg-white p-4 rounded-ios flex items-center justify-between shadow-sm mb-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 bg-gray-50 rounded-ios flex items-center justify-center text-gray-400 text-xs">
                                    <i :class="['fa-solid', getExpIcon(ex.category)]"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-xs">{{ ex.title }}</h4>
                                    <p class="text-[9px] text-gray-400">{{ ex.payer }} 付款 · {{ ex.amount }} {{ tripConfig.currency }}</p>
                                </div>
                            </div>
                            <button @click="deleteExpense(ex.id)" class="text-[9px] text-red-300">刪除</button>
                        </div>
                    </div>
                </section>

                <!-- 地圖導航 -->
                <section v-if="activeTab === 'map'" class="h-full flex flex-col bg-theme-bg relative">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm"><h2 class="text-2xl font-black text-theme-text">地圖指南</h2></div>
                    <div class="flex-grow overflow-y-auto p-6 space-y-4 pb-32 hide-scrollbar">
                        <div v-for="(item, idx) in filteredItinerary" :key="item.id" @click="openGoogleMap(item.location)" class="bg-white p-5 rounded-ios shadow-sm flex items-center space-x-4 active:scale-95 transition-transform">
                            <div class="w-12 h-12 bg-blue-50 rounded-ios flex items-center justify-center text-theme-primary text-lg font-black">{{ idx + 1 }}</div>
                            <h4 class="font-black text-theme-text text-sm flex-grow">{{ item.location }}</h4>
                            <div class="text-theme-primary"><i class="fa-solid fa-chevron-right"></i></div>
                        </div>
                        <div v-if="filteredItinerary.length === 0" class="text-center py-20 opacity-20"><p class="font-black">今日無行程景點</p></div>
                    </div>
                </section>

                <!-- 清單 -->
                <section v-if="activeTab === 'check'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm">
                        <h2 class="text-2xl font-black text-theme-text">行李檢查</h2>
                        <div class="w-full h-1.5 bg-gray-100 rounded-full mt-3 overflow-hidden">
                            <div class="h-full bg-theme-success transition-all duration-500" :style="{width: packingProgress + '%'}"></div>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto p-6 pb-32 space-y-6 hide-scrollbar">
                        <div v-for="cat in checklistCategories" :key="cat" class="space-y-2">
                            <div class="flex justify-between items-center px-1">
                                <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{{ cat }}</h3>
                                <button @click="openAddItem(cat)" class="text-theme-primary text-[9px] font-black">+ 新增</button>
                            </div>
                            <div class="bg-white rounded-ios shadow-sm divide-y divide-gray-50 overflow-hidden">
                                <div v-for="item in getItemsByCat(cat)" :key="item.id" @click="toggleCheck(item)" class="p-4 flex items-center space-x-3">
                                    <div :class="['w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all', item.checked ? 'bg-theme-success border-theme-success' : 'border-gray-200']">
                                        <i v-if="item.checked" class="fa-solid fa-check text-white text-[8px]"></i>
                                    </div>
                                    <span :class="['text-xs font-bold flex-grow', item.checked ? 'text-gray-300 line-through' : 'text-theme-text']">{{ item.name }}</span>
                                    <button @click.stop="removeItem(item.id)" class="text-gray-200"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <!-- 底部 Tab -->
            <nav class="fixed bottom-0 left-0 right-0 tab-bar border-t border-gray-100 px-6 pt-3 pb-safe z-[100]">
                <div class="flex justify-between items-center max-w-lg mx-auto pb-4">
                    <button v-for="tab in tabs" @click="activeTab = tab.id" :class="['flex flex-col items-center space-y-1', activeTab === tab.id ? 'text-theme-primary' : 'text-gray-400']">
                        <i :class="['text-lg', tab.icon]"></i>
                        <span class="text-[9px] font-black uppercase tracking-tighter">{{ tab.name }}</span>
                    </button>
                </div>
            </nav>
        </template>

        <!-- 彈窗 -->
        <transition name="slide-up">
            <div v-if="showAddEvent || showAddExpense || showAddItemModal" class="fixed inset-0 bg-black/40 z-[200] flex items-end" @click.self="closeModals">
                <div class="bg-white w-full rounded-t-ios p-8 pb-12 shadow-2xl">
                    <div v-if="showAddEvent" class="space-y-4">
                        <h3 class="font-black text-lg">新增行程</h3>
                        <input v-model="newEvent.location" type="text" placeholder="景點名稱" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <input v-model="newEvent.time" type="time" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <button @click="addEvent" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black">儲存</button>
                    </div>
                    <div v-if="showAddExpense" class="space-y-4">
                        <h3 class="font-black text-lg">新增支出 ({{ tripConfig.currency }})</h3>
                        <input v-model="newExpense.amount" type="number" placeholder="金額" class="w-full bg-gray-50 p-4 rounded-ios font-black text-xl outline-none">
                        <input v-model="newExpense.title" type="text" placeholder="項目" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <div class="grid grid-cols-2 gap-3">
                            <select v-model="newExpense.category" class="bg-gray-50 p-4 rounded-ios font-bold outline-none">
                                <option value="餐飲">餐飲</option>
                                <option value="交通">交通</option>
                                <option value="購物">購物</option>
                                <option value="住宿">住宿</option>
                            </select>
                            <select v-model="newExpense.payer" class="bg-gray-50 p-4 rounded-ios font-bold outline-none">
                                <option v-for="p in tripConfig.travelers" :key="p" :value="p">{{ p }} 付款</option>
                            </select>
                        </div>
                        <button @click="addExpense" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black">完成</button>
                    </div>
                    <div v-if="showAddItemModal" class="space-y-4">
                        <h3 class="font-black text-lg">新增至 {{ currentAddCat }}</h3>
                        <input v-model="newItemName" @keyup.enter="confirmAddItem" type="text" placeholder="項目名稱" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <button @click="confirmAddItem" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black">加入清單</button>
                    </div>
                </div>
            </div>
        </transition>

    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Firebase Config
        const getFirebaseConfig = () => {
            try { if (typeof __firebase_config !== 'undefined') return JSON.parse(__firebase_config); } catch (e) {}
            return {
                apiKey: "AIzaSyA6fV7gHlQMNYnGsiFyzMTYXrGpU93X96k",
                authDomain: "my-travel-app-eff55.firebaseapp.com",
                projectId: "my-travel-app-eff55",
                storageBucket: "my-travel-app-eff55.firebasestorage.app",
                messagingSenderId: "956233286029",
                appId: "1:956233286029:web:ae064b514f9246c7587dc4",
                measurementId: "G-5YT7CBYX27"
            };
        };

        const config = getFirebaseConfig();
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'travel-helper-final-v1';

        const { createApp, ref, computed, reactive, onMounted } = Vue;
        const AVATAR_COLORS = ['bg-red-400', 'bg-blue-400', 'bg-green-400', 'bg-orange-400', 'bg-purple-400'];

        const vueApp = createApp({
            setup() {
                const loading = ref(true);
                const user = ref(null);
                const showWizard = ref(false);
                const activeTab = ref('itinerary');
                const selectedDateStr = ref('');
                
                const showAddEvent = ref(false);
                const showAddExpense = ref(false);
                const showAddItemModal = ref(false);

                const tripConfig = ref({ destination: '', travelers: ['我'], currency: 'TWD', rate: 1, flag: '✈️', startDate: '', endDate: '' });
                const itinerary = ref([]);
                const expenses = ref([]);
                const checklist = ref([]);

                const wizardData = reactive({
                    destination: '', detectedCountry: '', currency: 'TWD', flag: '✈️', rate: 1,
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: new Date().toISOString().split('T')[0],
                    travelers: ['我']
                });

                const newEvent = ref({ location: '', time: '09:00' });
                const newExpense = ref({ amount: '', title: '', payer: '我', category: '餐飲' });
                const currentAddCat = ref('');
                const newItemName = ref('');

                const checklistCategories = ['行前準備', '電子產品', '日常用品', '證件文件'];

                const dateSequence = computed(() => {
                    const start = tripConfig.value.startDate || wizardData.startDate;
                    const end = tripConfig.value.endDate || wizardData.endDate;
                    if (!start || !end) return [];
                    const s = new Date(start);
                    const e = new Date(end);
                    const list = [];
                    const temp = new Date(s);
                    const week = ['日','一','二','三','四','五','六'];
                    while(temp <= e && list.length < 31) {
                        list.push({ 
                            dateStr: temp.toISOString().split('T')[0], 
                            dayNum: temp.getDate(), 
                            weekday: week[temp.getDay()] 
                        });
                        temp.setDate(temp.getDate() + 1);
                    }
                    return list;
                });

                const initCloudSync = (currentUser) => {
                    const uid = currentUser.uid;
                    const root = `artifacts/${APP_ID}/users/${uid}`;
                    
                    onSnapshot(doc(db, root, 'settings', 'main'), (s) => {
                        if(s.exists()){
                            tripConfig.value = s.data();
                            showWizard.value = false;
                            if(!selectedDateStr.value) selectedDateStr.value = tripConfig.value.startDate;
                        } else { 
                            showWizard.value = true; 
                        }
                        loading.value = false;
                        // 關閉啟動載入器
                        const loader = document.getElementById('startup-loader');
                        if(loader) loader.style.display = 'none';
                    }, (err) => {
                        loading.value = false;
                    });

                    onSnapshot(collection(db, root, 'itinerary'), (s) => itinerary.value = s.docs.map(d=>({id:d.id, ...d.data()})), (e)=>{});
                    onSnapshot(collection(db, root, 'expenses'), (s) => expenses.value = s.docs.map(d=>({id:d.id, ...d.data()})), (e)=>{});
                    onSnapshot(collection(db, root, 'checklist'), (s) => checklist.value = s.docs.map(d=>({id:d.id, ...d.data()})), (e)=>{});
                };

                onMounted(async () => {
                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            user.value = u;
                            initCloudSync(u);
                        }
                    });

                    // 認證初始化
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Auth Error", e);
                        loading.value = false;
                        const loader = document.getElementById('startup-loader');
                        if(loader) loader.style.display = 'none';
                    }
                });

                const detectLocationInfo = () => {
                    const locs = [
                        { keys: ['沖繩','大阪','東京','日本','福岡','北海道'], country: '日本', cur: 'JPY', rate: 0.22, flag: '🇯🇵' },
                        { keys: ['首爾','釜山','韓國'], country: '韓國', cur: 'KRW', rate: 0.024, flag: '🇰🇷' },
                        { keys: ['曼谷','清邁','泰國','普吉'], country: '泰國', cur: 'THB', rate: 0.94, flag: '🇹🇭' },
                        { keys: ['胡志明','越南','河內','峴港'], country: '越南', cur: 'VND', rate: 0.0013, flag: '🇻🇳' },
                        { keys: ['香港'], country: '香港', cur: 'HKD', rate: 4.1, flag: '🇭🇰' },
                        { keys: ['巴黎','法國','義大利','德國','歐洲'], country: '歐洲', cur: 'EUR', rate: 35.5, flag: '🇪🇺' },
                        { keys: ['倫敦','英國'], country: '英國', cur: 'GBP', rate: 41.2, flag: '🇬🇧' },
                        { keys: ['美國','紐約','洛杉磯'], country: '美國', cur: 'USD', rate: 32.5, flag: '🇺🇸' }
                    ];
                    const found = locs.find(l => l.keys.some(k => wizardData.destination.includes(k)));
                    if(found) {
                        wizardData.detectedCountry = found.country; wizardData.currency = found.cur;
                        wizardData.rate = found.rate; wizardData.flag = found.flag;
                    } else {
                        wizardData.detectedCountry = ''; wizardData.currency = 'TWD'; wizardData.rate = 1; wizardData.flag = '✈️';
                    }
                };

                const balances = computed(() => {
                    const group = tripConfig.value.travelers || [];
                    const res = {}; group.forEach(n => res[n] = 0);
                    expenses.value.forEach(ex => {
                        const amt = Number(ex.amount) || 0;
                        const avg = amt / Math.max(group.length, 1);
                        if(res.hasOwnProperty(ex.payer)) res[ex.payer] += amt;
                        group.forEach(n => res[n] -= avg);
                    });
                    return res;
                });

                const saveWizardSettings = async () => {
                    if(!wizardData.destination || !user.value) return;
                    const data = JSON.parse(JSON.stringify(wizardData));
                    data.travelers = data.travelers.filter(t=>t.trim());
                    await setDoc(doc(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'settings', 'main'), data);
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                };

                return {
                    loading, showWizard, activeTab, selectedDateStr, tripConfig, itinerary, expenses, checklist, checklistCategories,
                    wizardData, newEvent, newExpense, showAddEvent, showAddExpense, showAddItemModal, currentAddCat, newItemName,
                    detectLocationInfo, saveWizardSettings, balances,
                    isWizardValid: computed(() => wizardData.destination && wizardData.destination.trim().length > 0),
                    dateSequence, 
                    currentDayIndex: computed(() => dateSequence.value.findIndex(d => d.dateStr === selectedDateStr.value)),
                    filteredItinerary: computed(() => itinerary.value.filter(i => i.dateStr === selectedDateStr.value).sort((a,b) => a.time.localeCompare(b.time))),
                    totalExpenseAmount: computed(() => expenses.value.reduce((s, e) => s + (Number(e.amount) || 0), 0)),
                    packingProgress: computed(() => checklist.value.length ? Math.round((checklist.value.filter(i => i.checked).length / checklist.value.length) * 100) : 0),
                    getItemsByCat: (cat) => checklist.value.filter(i => i.category === cat),
                    toggleCheck: async (item) => { if(!user.value) return; await updateDoc(doc(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'checklist', item.id), { checked: !item.checked }); },
                    removeItem: async (id) => { if(!user.value) return; await deleteDoc(doc(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'checklist', id)); },
                    deleteEvent: async (id) => { if(!user.value) return; await deleteDoc(doc(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'itinerary', id)); },
                    deleteExpense: async (id) => { if(!user.value) return; await deleteDoc(doc(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'expenses', id)); },
                    addEvent: async () => {
                        if(!newEvent.value.location || !user.value) return;
                        await addDoc(collection(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'itinerary'), { ...newEvent.value, dateStr: selectedDateStr.value });
                        newEvent.value = { location: '', time: '09:00' }; showAddEvent.value = false;
                    },
                    addExpense: async () => {
                        if(!newExpense.value.amount || !user.value) return;
                        await addDoc(collection(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'expenses'), { ...newExpense.value });
                        newExpense.value = { amount: '', title: '', payer: tripConfig.value.travelers[0] || '我', category: '餐飲' };
                        showAddExpense.value = false;
                    },
                    openAddItem: (cat) => { currentAddCat.value = cat; newItemName.value = ''; showAddItemModal.value = true; },
                    confirmAddItem: async () => {
                        if (!newItemName.value || !user.value) return;
                        await addDoc(collection(db, `artifacts/${APP_ID}/users/${user.value.uid}`, 'checklist'), { category: currentAddCat.value, name: newItemName.value, checked: false });
                        showAddItemModal.value = false;
                    },
                    closeModals: () => { showAddEvent.value = false; showAddExpense.value = false; showAddItemModal.value = false; },
                    getColorClass: (i) => AVATAR_COLORS[i % AVATAR_COLORS.length],
                    getColorClassByName: (name) => AVATAR_COLORS[(tripConfig.value.travelers || []).indexOf(name) % AVATAR_COLORS.length] || 'bg-gray-400',
                    getExpIcon: (c) => ({'餐飲':'fa-utensils','交通':'fa-train','購物':'fa-bag-shopping','住宿':'fa-bed'}[c] || 'fa-tag'),
                    openGoogleMap: (l) => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l)}`),
                    tabs: [
                        { id: 'itinerary', name: '行程', icon: 'fa-solid fa-calendar-check' },
                        { id: 'map', name: '地圖', icon: 'fa-solid fa-map-location-dot' },
                        { id: 'split', name: '結算', icon: 'fa-solid fa-wallet' },
                        { id: 'check', name: '清單', icon: 'fa-solid fa-list-check' }
                    ]
                };
            }
        });

        vueApp.mount('#app');
    </script>
</body>
</html>
