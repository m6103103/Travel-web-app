<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>要企哪玩 - 旅遊協作平台</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            'bg': '#F2F2F7',
                            'primary': '#007AFF',
                            'text': '#1C1C1E',
                            'success': '#34C759',
                            'danger': '#FF3B30',
                            'secondary': '#8E8E93'
                        }
                    },
                    borderRadius: { 'ios': '20px' }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none !important; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .tab-bar { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .date-chip-active { background-color: #007AFF; color: white; transform: scale(1.05); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        #startup-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F2F2F7; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        .ios-card { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01), 0 2px 4px -1px rgba(0,0,0,0.01); }
    </style>
</head>
<body>
    <div id="startup-loader">
        <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div id="app" v-cloak class="h-screen w-full relative overflow-hidden flex flex-col">
        
        <!-- 全域載入狀態 -->
        <div v-if="loading" class="fixed inset-0 z-[1000] bg-white/80 backdrop-blur-md flex flex-col items-center justify-center">
            <div class="w-10 h-10 border-4 border-theme-primary border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- 初始畫面與開團流程 -->
        <div v-if="(!currentTripId || (currentTripId && !myIdentity)) && !loading" class="fixed inset-0 z-[999] bg-white flex flex-col">
            <template v-if="!currentTripId">
                <div class="pt-20 px-8 pb-4 text-center">
                    <h1 class="text-4xl font-black text-theme-text mb-2">要企哪玩 {{ wizardData.flag }}</h1>
                    <p class="text-gray-400 text-sm font-bold">同步您的旅伴，共享每一刻。</p>
                </div>
                <div class="flex-grow px-8 space-y-6 overflow-y-auto hide-scrollbar pb-10">
                    <div class="grid grid-cols-2 gap-4">
                        <button @click="initType = 'create'" :class="['p-6 rounded-ios border-2 transition-all', initType === 'create' ? 'border-theme-primary bg-blue-50' : 'border-gray-100']">
                            <i class="fa-solid fa-flag text-xl mb-2 block"></i>開團
                        </button>
                        <button @click="initType = 'join'" :class="['p-6 rounded-ios border-2 transition-all', initType === 'join' ? 'border-theme-primary bg-blue-50' : 'border-gray-100']">
                            <i class="fa-solid fa-person-walking-luggage text-xl mb-2 block"></i>跟團
                        </button>
                    </div>

                    <div v-if="initType === 'join'" class="space-y-4">
                        <input v-model="joinCode" type="text" placeholder="旅程編碼" class="w-full bg-gray-50 p-4 rounded-ios font-bold text-center uppercase outline-none">
                        <button @click="joinTrip" class="w-full py-5 bg-theme-primary text-white rounded-ios font-black">加入</button>
                    </div>

                    <div v-if="initType === 'create'" class="space-y-4">
                        <div class="relative">
                            <input v-model="wizardData.destination" @input="handleLocationInput" placeholder="目的地 (如: 東京, 韓國...)" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none border border-transparent focus:border-theme-primary">
                            <span class="absolute right-4 top-4 text-xl">{{ wizardData.flag }}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="relative">
                                <span class="absolute left-3 top-1 text-[8px] text-gray-400 font-bold uppercase">開始日期</span>
                                <input v-model="wizardData.startDate" type="date" class="w-full bg-gray-50 pt-5 pb-2 px-3 rounded-ios text-xs outline-none">
                            </div>
                            <div class="relative">
                                <span class="absolute left-3 top-1 text-[8px] text-gray-400 font-bold uppercase">結束日期</span>
                                <input v-model="wizardData.endDate" type="date" class="w-full bg-gray-50 pt-5 pb-2 px-3 rounded-ios text-xs outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="relative">
                                <span class="absolute left-3 top-1 text-[8px] text-gray-400 font-bold uppercase">外幣幣別</span>
                                <input v-model="wizardData.currency" placeholder="幣別" class="w-full bg-gray-50 pt-5 pb-2 px-3 rounded-ios text-sm uppercase font-black">
                            </div>
                            <div class="relative">
                                <span class="absolute left-3 top-1 text-[8px] text-gray-400 font-bold uppercase">匯率 (對TWD)</span>
                                <input v-model.number="wizardData.rate" type="number" step="0.0001" placeholder="匯率" class="w-full bg-gray-50 pt-5 pb-2 px-3 rounded-ios text-sm font-black">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-black text-gray-400 uppercase">行程成員</span>
                                <button @click="wizardTravelers.push('')" class="text-theme-primary text-[10px] font-black">+ 新增成員</button>
                            </div>
                            <div v-for="(name, idx) in wizardTravelers" :key="idx" class="flex space-x-2">
                                <input v-model="wizardTravelers[idx]" placeholder="成員姓名" class="flex-grow bg-gray-50 p-3 rounded-ios text-sm">
                                <button v-if="idx > 0" @click="wizardTravelers.splice(idx,1)" class="text-gray-300"><i class="fa-solid fa-circle-minus"></i></button>
                            </div>
                        </div>
                        <button @click="createNewTrip" :disabled="!wizardData.destination" class="w-full py-5 bg-theme-primary text-white rounded-ios font-black disabled:opacity-50 shadow-lg">開始我的旅程</button>
                    </div>
                </div>
            </template>
            <template v-else>
                <div class="pt-20 px-8 pb-4"><h1 class="text-3xl font-black">誰在操作？</h1></div>
                <div class="flex-grow px-8 py-10 grid grid-cols-2 gap-4 overflow-y-auto hide-scrollbar">
                    <button v-for="(name, idx) in tripConfig.travelers" :key="name" @click="claimIdentity(name)" class="p-6 bg-gray-50 rounded-ios border-2 border-transparent hover:border-theme-primary transition-all">
                        <div :class="['w-12 h-12 rounded-full mx-auto mb-2 flex items-center justify-center text-white font-black shadow-sm', getColorClass(idx)]">{{ name[0] }}</div>
                        <span class="font-black text-theme-text">{{ name }}</span>
                    </button>
                </div>
            </template>
        </div>

        <!-- 主界面 -->
        <template v-if="currentTripId && myIdentity && !loading">
            <main class="flex-grow relative z-10 overflow-hidden flex flex-col">
                
                <!-- 1. 行程規劃 (共同編輯) -->
                <section v-show="activeTab === 'itinerary'" class="h-full flex flex-col bg-theme-bg">
                    <div class="pt-14 pb-4 bg-white shadow-sm z-20">
                        <div class="px-6 flex justify-between items-end mb-4">
                            <div>
                                <h2 class="text-xl font-black">{{ tripConfig.destination }} {{ tripConfig.flag }}</h2>
                                <p @click="copyTripCode" class="text-[10px] text-gray-400 font-bold">編碼: {{ currentTripId }} <i class="fa-solid fa-copy ml-1"></i></p>
                            </div>
                            <button @click="openAddEvent" class="w-10 h-10 bg-theme-primary text-white rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        <div class="flex space-x-3 overflow-x-auto px-6 pb-2 hide-scrollbar">
                            <button v-for="day in dateSequence" :key="day.dateStr" @click="selectedDateStr = day.dateStr" :class="['flex-shrink-0 w-14 h-16 rounded-ios flex flex-col items-center justify-center transition-all', selectedDateStr === day.dateStr ? 'date-chip-active shadow-md' : 'bg-gray-50 text-gray-400']">
                                <span class="text-[9px] font-black uppercase">{{ day.weekday }}</span>
                                <span class="text-base font-black">{{ day.dayNum }}</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto px-6 pt-4 pb-32 hide-scrollbar">
                        <div v-if="filteredItinerary.length === 0" class="text-center py-20 text-gray-300 font-bold">這天還沒排行程喔</div>
                        <div v-for="(item, idx) in filteredItinerary" :key="item.id" class="relative pl-11 py-1 mb-4">
                            <div class="absolute left-0 w-8 h-8 rounded-full bg-white border-2 border-theme-primary flex items-center justify-center text-[10px] font-black text-theme-primary translate-y-3 shadow-sm">{{ idx + 1 }}</div>
                            <div class="p-5 rounded-ios bg-white shadow-sm">
                                <div class="flex justify-between items-start">
                                    <div @click="openGoogleMap(item.location)" class="cursor-pointer">
                                        <p class="text-[10px] font-black text-theme-primary uppercase">{{ item.time }}</p>
                                        <h4 class="font-bold text-theme-text text-base">{{ item.location }}</h4>
                                    </div>
                                    <button @click="deleteEvent(item.id)" class="text-gray-200 hover:text-red-400 transition-colors"><i class="fa-solid fa-trash-can text-sm"></i></button>
                                </div>
                                <p v-if="item.note" class="mt-2 text-[11px] text-gray-400">「 {{ item.note }} 」</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 2. 行程地圖 (共同編輯同步) -->
                <section v-show="activeTab === 'map'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm">
                        <h2 class="text-2xl font-black">地圖導航</h2>
                        <p class="text-xs font-bold text-gray-400">當前選擇：{{ selectedDateStr }}</p>
                    </div>
                    <div class="flex-grow overflow-y-auto p-6 pb-32 hide-scrollbar space-y-3">
                        <div v-if="filteredItinerary.length === 0" class="text-center py-20 text-gray-300 font-bold">本日尚無行程地點</div>
                        <div v-for="item in filteredItinerary" :key="item.id" class="bg-white p-5 rounded-ios shadow-sm flex justify-between items-center">
                            <div>
                                <p class="text-[10px] font-black text-theme-primary">{{ item.time }}</p>
                                <h4 class="font-black text-theme-text">{{ item.location }}</h4>
                            </div>
                            <button @click="openGoogleMap(item.location)" class="px-4 py-2 bg-theme-primary text-white rounded-full text-xs font-black shadow-sm">
                                <i class="fa-solid fa-location-arrow mr-1"></i>導航
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 3. 分帳功能 (共同編輯) -->
                <section v-show="activeTab === 'split'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm flex justify-between items-center">
                        <h2 class="text-2xl font-black">分帳結算</h2>
                        <button @click="openAddExpense" class="px-5 py-2.5 bg-theme-primary text-white rounded-full text-xs font-black shadow-lg">+ 記一筆</button>
                    </div>
                    <div class="flex-grow overflow-y-auto p-6 pb-32 hide-scrollbar">
                        
                        <!-- 總支出卡片 -->
                        <div class="bg-theme-text p-6 rounded-ios shadow-lg mb-6 text-white relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 text-white/5 text-8xl font-black rotate-12">TOTAL</div>
                            <p class="text-[10px] text-gray-400 mb-1">旅程總支出估計</p>
                            <h3 class="text-3xl font-black">NT$ {{ Math.round(totalExpenseInTWD).toLocaleString() }}</h3>
                            <div class="mt-4 flex space-x-4 border-t border-white/10 pt-4">
                                <div><p class="text-[8px] text-gray-400">當地總額 ({{ tripConfig.currency }})</p><p class="font-black text-sm">{{ Math.round(totalExpenseInLocal).toLocaleString() }}</p></div>
                                <div><p class="text-[8px] text-gray-400">匯率</p><p class="font-black text-sm">1 : {{ tripConfig.rate }}</p></div>
                            </div>
                        </div>

                        <!-- 結算建議 -->
                        <div class="mb-6">
                            <h3 class="text-[10px] font-black text-gray-400 mb-3 uppercase tracking-widest">結算建議 (應付金額)</h3>
                            <div class="space-y-3">
                                <div v-if="settlements.length === 0" class="text-center py-4 bg-white/50 rounded-ios text-xs font-bold text-gray-400">目前帳務平衡</div>
                                <div v-for="(s, idx) in settlements" :key="idx" class="bg-white p-5 rounded-ios shadow-sm flex justify-between items-center border-l-4 border-theme-primary">
                                    <div class="flex items-center space-x-3">
                                        <div class="flex -space-x-2">
                                            <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-[10px] font-black shadow-sm ring-2 ring-white">{{ s.from[0] }}</div>
                                            <div class="w-8 h-8 rounded-full bg-theme-primary flex items-center justify-center text-[10px] text-white font-black shadow-sm ring-2 ring-white"><i class="fa-solid fa-arrow-right"></i></div>
                                            <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-[10px] font-black shadow-sm ring-2 ring-white">{{ s.to[0] }}</div>
                                        </div>
                                        <p class="text-xs font-bold"><span class="text-theme-text">{{ s.from }}</span> 應付給 <span class="text-theme-text">{{ s.to }}</span></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="font-black text-theme-primary text-sm">NT$ {{ Math.round(s.amountTWD).toLocaleString() }}</p>
                                        <p class="text-[9px] text-gray-400">{{ Math.round(s.amountLocal).toLocaleString() }} {{ tripConfig.currency }}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 支出明細 -->
                        <h3 class="text-[10px] font-black text-gray-400 mb-3 uppercase tracking-widest">支出明細</h3>
                        <div v-for="ex in sortedExpenses" :key="ex.id" class="bg-white p-4 rounded-ios mb-3 shadow-sm flex justify-between items-center">
                            <div class="flex-grow">
                                <div class="flex items-center space-x-2">
                                    <span class="w-2 h-2 rounded-full" :style="{backgroundColor: getColorHex(tripConfig.travelers.indexOf(ex.payer))}"></span>
                                    <h4 class="font-bold text-sm">{{ ex.title }}</h4>
                                </div>
                                <p class="text-[9px] text-gray-400 mt-1">{{ ex.date }} {{ ex.time }} · {{ ex.payer }} 付款</p>
                                <p class="text-[9px] text-gray-300">均攤：{{ ex.participants.join(', ') }}</p>
                            </div>
                            <div class="text-right flex items-center space-x-3">
                                <div>
                                    <p class="font-black text-theme-text text-sm">{{ ex.amount }} {{ ex.currency }}</p>
                                    <p class="text-[9px] text-gray-400">≈ NT$ {{ Math.round(ex.amountInTWD) }}</p>
                                </div>
                                <button @click="deleteExpense(ex.id)" class="text-gray-200 ml-2 hover:text-red-400 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 4. 行李清單 (個人各自編輯) -->
                <section v-show="activeTab === 'check'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-2 bg-white shadow-sm flex justify-between items-center">
                        <h2 class="text-2xl font-black">我的行李</h2>
                        <span class="text-[10px] bg-gray-100 px-3 py-1 rounded-full text-gray-400 font-bold">個人清單</span>
                    </div>
                    <div class="flex-grow overflow-y-auto p-6 pb-32 hide-scrollbar space-y-6">
                        <div v-for="cat in checkCategories" :key="cat" class="bg-white rounded-ios shadow-sm p-4">
                            <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-2">
                                <h3 class="font-black text-sm text-theme-primary"><i class="fa-solid fa-tag mr-2"></i>{{ cat }}</h3>
                                <button @click="promptAddItem(cat)" class="text-[10px] bg-blue-50 px-3 py-1.5 rounded-full font-black text-theme-primary shadow-sm">+ 新增</button>
                            </div>
                            
                            <div v-if="getCategoryItems(cat).length === 0" class="py-4 text-center text-[10px] text-gray-300 font-bold">目前無項目</div>
                            
                            <div v-for="item in getCategoryItems(cat)" :key="item.id" @click="toggleCheck(item)" :class="['flex items-center py-3 border-b border-gray-50 last:border-0 transition-all cursor-pointer group', item.checked ? 'opacity-40' : '']">
                                <div :class="['w-5 h-5 rounded-md border-2 flex items-center justify-center mr-3 transition-colors flex-shrink-0', item.checked ? 'bg-theme-success border-theme-success' : 'border-gray-200']">
                                    <i v-if="item.checked" class="fa-solid fa-check text-white text-[8px]"></i>
                                </div>
                                <span :class="['text-sm font-bold flex-grow text-theme-text truncate', item.checked ? 'line-through' : '']">{{ item.name }}</span>
                                <button @click.stop="removeItem(item.id)" class="text-gray-200 hover:text-theme-danger transition-all px-2 ml-2">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <!-- 導航欄 -->
            <nav class="fixed bottom-0 left-0 right-0 tab-bar border-t border-gray-100 pt-3 pb-safe z-[100]">
                <div class="flex justify-between items-center max-w-lg mx-auto px-8 pb-4">
                    <button v-for="tab in tabs" :key="tab.id" @click="activeTab = tab.id" :class="['flex flex-col items-center transition-all', activeTab === tab.id ? 'text-theme-primary' : 'text-gray-300']">
                        <i :class="['text-xl mb-1', tab.icon]"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">{{ tab.name }}</span>
                    </button>
                </div>
            </nav>
        </template>

        <!-- 彈出視窗 -->
        <div v-if="showAddEvent || showAddExpense" class="fixed inset-0 bg-black/40 z-[200] flex items-end" @click.self="closeModals">
            <div class="bg-white w-full rounded-t-ios p-8 pb-12 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div v-if="showAddEvent" class="space-y-4">
                    <h3 class="font-black text-lg text-theme-text">新增目的地</h3>
                    <input v-model="newEvent.location" placeholder="地點名稱" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none border border-transparent focus:border-theme-primary">
                    <input v-model="newEvent.time" type="time" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                    <textarea v-model="newEvent.note" placeholder="備註..." class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none h-24 border border-transparent focus:border-theme-primary"></textarea>
                    <button @click="addEvent" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black shadow-lg">確定新增</button>
                </div>

                <div v-if="showAddExpense" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-black text-lg text-theme-text">新增支出</h3>
                        <div class="flex space-x-1 bg-gray-100 p-1 rounded-ios text-[10px] font-black">
                            <button @click="newExpense.currency = 'TWD'" :class="['px-3 py-1 rounded-ios transition-all', newExpense.currency === 'TWD' ? 'bg-white shadow-sm text-theme-primary' : 'text-gray-400']">TWD</button>
                            <button @click="newExpense.currency = tripConfig.currency" :class="['px-3 py-1 rounded-ios transition-all', newExpense.currency === tripConfig.currency ? 'bg-white shadow-sm text-theme-primary' : 'text-gray-400']">{{ tripConfig.currency }}</button>
                        </div>
                    </div>
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-xs font-black text-gray-300">{{ newExpense.currency }}</span>
                        <input v-model.number="newExpense.amount" type="number" placeholder="0" class="w-full bg-gray-50 p-6 pt-10 rounded-ios text-4xl font-black text-right outline-none">
                        <p v-if="newExpense.currency !== 'TWD'" class="text-[10px] text-right text-gray-400 mt-1 font-bold">預估 NT$ {{ Math.round(newExpense.amount * tripConfig.rate) }}</p>
                    </div>
                    <input v-model="newExpense.title" placeholder="項目名稱" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none border border-transparent focus:border-theme-primary">
                    <div>
                        <p class="text-[10px] font-black text-gray-400 mb-2">分攤成員</p>
                        <div class="flex flex-wrap gap-2">
                            <button v-for="t in tripConfig.travelers" :key="t" @click="toggleExpenseParticipant(t)" :class="['px-4 py-2 rounded-full font-bold text-xs transition-all', newExpense.participants.includes(t) ? 'bg-theme-primary text-white shadow-sm' : 'bg-gray-50 text-gray-400']">{{ t }}</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select v-model="newExpense.payer" class="bg-gray-50 p-3 rounded-ios font-bold text-xs outline-none">
                            <option v-for="t in tripConfig.travelers" :key="t" :value="t">{{ t }} 付款</option>
                        </select>
                        <input v-model="newExpense.date" type="date" class="bg-gray-50 p-3 rounded-ios text-[10px] outline-none">
                    </div>
                    <button @click="addExpense" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black shadow-lg">確定記帳</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, deleteDoc, addDoc, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Firebase 配置資訊
        const firebaseConfig = {
          apiKey: "AIzaSyA6fV7gHlQMNYnGsiFyzMTYXrGpU93X96k",
          authDomain: "my-travel-app-eff55.firebaseapp.com",
          projectId: "my-travel-app-eff55",
          storageBucket: "my-travel-app-eff55.firebasestorage.app",
          messagingSenderId: "956233286029",
          appId: "1:956233286029:web:ae064b514f9246c7587dc4",
          measurementId: "G-5YT7CBYX27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 使用 Artifact ID 管理資料集路徑
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'travel-master-v3';

        const { createApp, ref, computed, reactive, onMounted, watch } = Vue;
        const AVATAR_COLORS = ['bg-red-400', 'bg-blue-400', 'bg-green-400', 'bg-orange-400', 'bg-purple-400'];
        const HEX_COLORS = ['#f87171', '#60a5fa', '#4ade80', '#fb923c', '#a78bfa'];

        createApp({
            setup() {
                const loading = ref(true);
                const user = ref(null);
                const initType = ref('create'); 
                const joinCode = ref('');
                const currentTripId = ref(localStorage.getItem('lastTripId') || '');
                const myIdentity = ref(localStorage.getItem('myIdentity') || '');
                
                // 行程基本設定
                const wizardData = reactive({ destination: '', startDate: '', endDate: '', currency: 'TWD', rate: 1, flag: '✈️' });
                const wizardTravelers = ref(['我']);
                const tripConfig = ref({ travelers: [], rate: 1, currency: 'TWD', startDate: '', destination: '', flag: '✈️' });
                
                // 共同編輯資料 (Firebase 同步)
                const itinerary = ref([]);
                const expenses = ref([]);
                
                // 個人編輯資料 (LocalStorage 各自編輯)
                const DEFAULT_LIST = [
                    { id: 1, name: '護照/台胞證', category: '行前準備', checked: false },
                    { id: 2, name: '保險證明', category: '行前準備', checked: false },
                    { id: 3, name: '行動電源/充電頭', category: '電子3C', checked: false },
                    { id: 4, name: '常備藥品', category: '必備藥品', checked: false },
                    { id: 5, name: '旅行轉接頭', category: '電子3C', checked: false }
                ];
                const personalList = ref(JSON.parse(localStorage.getItem('personalList') || JSON.stringify(DEFAULT_LIST)));

                const activeTab = ref('itinerary');
                const selectedDateStr = ref('');
                const showAddEvent = ref(false);
                const showAddExpense = ref(false);

                const newEvent = reactive({ location: '', time: '10:00', note: '' });
                const newExpense = reactive({ amount: null, title: '', payer: '', currency: 'TWD', date: '', time: '', participants: [] });

                // 連接 Firebase 實現共同編輯
                const connectToTrip = (tripId) => {
                    if (!user.value) return;
                    loading.value = true;
                    
                    // 1. 監聽旅程配置 (共同)
                    onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripId), (s) => {
                        if(s.exists()){
                            tripConfig.value = s.data();
                            if(!selectedDateStr.value) selectedDateStr.value = tripConfig.value.startDate;
                        }
                        loading.value = false;
                        const loader = document.getElementById('startup-loader');
                        if (loader) loader.style.display = 'none';
                    }, (err) => { loading.value = false; });
                    
                    // 2. 監聽行程事件 (共同編輯)
                    const eventsColl = collection(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripId, 'events');
                    onSnapshot(eventsColl, (s) => { 
                        itinerary.value = s.docs.map(d=>({id:d.id, ...d.data()})); 
                    });
                    
                    // 3. 監聽分帳支出 (共同編輯)
                    const expensesColl = collection(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripId, 'expenses');
                    onSnapshot(expensesColl, (s) => { 
                        expenses.value = s.docs.map(d=>({id:d.id, ...d.data()})); 
                    });
                };

                onMounted(async () => {
                    // 認證初始化 (遵循 Rule 3)
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
                    } else { await signInAnonymously(auth); }
                    
                    onAuthStateChanged(auth, (u) => {
                        user.value = u;
                        if(u && currentTripId.value) connectToTrip(currentTripId.value);
                        else { 
                            loading.value = false; 
                            const loader = document.getElementById('startup-loader');
                            if (loader) loader.style.display = 'none'; 
                        }
                    });
                });

                // 監視個人行李清單並存入 LocalStorage (各自編輯)
                watch(personalList, (newList) => { 
                    localStorage.setItem('personalList', JSON.stringify(newList)); 
                }, { deep: true });

                const handleLocationInput = () => {
                    const val = wizardData.destination;
                    const locs = [
                        { keys: ['東京','大阪','日本','沖繩','北海道','名古屋','福岡'], cur: 'JPY', rate: 0.22, flag: '🇯🇵' },
                        { keys: ['韓國','首爾','釜山','濟州'], cur: 'KRW', rate: 0.024, flag: '🇰🇷' },
                        { keys: ['泰國','曼谷','清邁','普吉'], cur: 'THB', rate: 0.92, flag: '🇹🇭' },
                        { keys: ['香港'], cur: 'HKD', rate: 4.1, flag: '🇭🇰' },
                        { keys: ['美國','紐約','洛杉磯'], cur: 'USD', rate: 32.5, flag: '🇺🇸' },
                        { keys: ['新加坡'], cur: 'SGD', rate: 24.2, flag: '🇸🇬' },
                        { keys: ['越南'], cur: 'VND', rate: 0.0013, flag: '🇻🇳' }
                    ];
                    const found = locs.find(l => l.keys.some(k => val.includes(k)));
                    if(found) { 
                        wizardData.currency = found.cur; 
                        wizardData.rate = found.rate; 
                        wizardData.flag = found.flag; 
                    } else {
                        wizardData.currency = 'TWD';
                        wizardData.rate = 1;
                        wizardData.flag = '✈️';
                    }
                };

                return {
                    loading, initType, joinCode, currentTripId, myIdentity, wizardData, wizardTravelers, tripConfig, activeTab, selectedDateStr,
                    itinerary, expenses, personalList, showAddEvent, showAddExpense, newEvent, newExpense, handleLocationInput,
                    checkCategories: ['行前準備', '電子3C', '必備藥品', '生活用品', '其他'],
                    
                    dateSequence: computed(() => {
                        if(!tripConfig.value.startDate) return [];
                        const list = []; const temp = new Date(tripConfig.value.startDate); 
                        const end = new Date(tripConfig.value.endDate || tripConfig.value.startDate);
                        const week = ['日','一','二','三','四','五','六'];
                        while(temp <= end && list.length < 31) { 
                            list.push({ dateStr: temp.toISOString().split('T')[0], dayNum: temp.getDate(), weekday: week[temp.getDay()] }); 
                            temp.setDate(temp.getDate() + 1); 
                        }
                        return list;
                    }),

                    filteredItinerary: computed(() => itinerary.value.filter(i => i.dateStr === selectedDateStr.value).sort((a,b)=>a.time.localeCompare(b.time))),
                    
                    totalExpenseInTWD: computed(() => expenses.value.reduce((s, e) => s + (e.amountInTWD || 0), 0)),
                    
                    totalExpenseInLocal: computed(() => expenses.value.reduce((s, e) => {
                        if (e.currency === tripConfig.value.currency) return s + e.amount;
                        if (e.currency === 'TWD') return s + (e.amount / tripConfig.value.rate);
                        return s;
                    }, 0)),

                    settlements: computed(() => {
                        const balances = {};
                        tripConfig.value.travelers.forEach(t => balances[t] = 0);
                        expenses.value.forEach(ex => {
                            const inTWD = ex.amountInTWD || 0;
                            balances[ex.payer] += inTWD;
                            const share = inTWD / (ex.participants?.length || 1);
                            ex.participants?.forEach(p => balances[p] -= share);
                        });
                        const debtors = []; const creditors = [];
                        for (let t in balances) {
                            if (balances[t] < -0.01) debtors.push({ name: t, amt: -balances[t] });
                            else if (balances[t] > 0.01) creditors.push({ name: t, amt: balances[t] });
                        }
                        const result = []; let i = 0, j = 0;
                        while (i < debtors.length && j < creditors.length) {
                            const settleAmt = Math.min(debtors[i].amt, creditors[j].amt);
                            result.push({
                                from: debtors[i].name, to: creditors[j].name,
                                amountTWD: settleAmt, amountLocal: settleAmt / tripConfig.value.rate
                            });
                            debtors[i].amt -= settleAmt; creditors[j].amt -= settleAmt;
                            if (debtors[i].amt < 0.01) i++; if (creditors[j].amt < 0.01) j++;
                        }
                        return result;
                    }),

                    sortedExpenses: computed(() => [...expenses.value].sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time))),

                    // 行程操作 (共同同步)
                    openAddEvent: () => showAddEvent.value = true,
                    addEvent: async () => { 
                        if(!newEvent.location) return;
                        await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'events'), { ...newEvent, dateStr: selectedDateStr.value }); 
                        showAddEvent.value = false; Object.assign(newEvent, {location:'', time:'10:00', note:''});
                    },
                    deleteEvent: (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'events', id)),
                    
                    // 分帳操作 (共同同步)
                    openAddExpense: () => { 
                        showAddExpense.value = true; 
                        const now = new Date();
                        Object.assign(newExpense, { 
                            amount: null, title: '', payer: myIdentity.value, currency: tripConfig.value.currency, 
                            date: now.toISOString().split('T')[0], time: now.toTimeString().split(' ')[0].substring(0, 5),
                            participants: [...tripConfig.value.travelers] 
                        });
                    },
                    toggleExpenseParticipant: (name) => {
                        const idx = newExpense.participants.indexOf(name);
                        if(idx > -1) newExpense.participants.splice(idx, 1);
                        else newExpense.participants.push(name);
                    },
                    addExpense: async () => {
                        if(!newExpense.amount) return;
                        const inTWD = newExpense.currency === 'TWD' ? newExpense.amount : newExpense.amount * tripConfig.value.rate;
                        await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'expenses'), { ...newExpense, amountInTWD: inTWD });
                        showAddExpense.value = false;
                    },
                    deleteExpense: (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'expenses', id)),

                    // 行李操作 (個人獨立)
                    getCategoryItems: (cat) => personalList.value.filter(i => i.category === cat),
                    promptAddItem: (cat) => {
                        const name = prompt(`要在「${cat}」中新增什麼項目？`);
                        if(name && name.trim()) {
                            personalList.value.push({ 
                                id: Date.now() + Math.random(), 
                                name: name.trim(), 
                                category: cat, 
                                checked: false 
                            });
                        }
                    },
                    toggleCheck: (item) => item.checked = !item.checked,
                    removeItem: (id) => {
                        personalList.value = personalList.value.filter(i => i.id !== id);
                    },

                    openGoogleMap: (location) => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`, '_blank'),
                    copyTripCode: () => { 
                        const dummy = document.createElement("input");
                        document.body.appendChild(dummy);
                        dummy.value = currentTripId.value;
                        dummy.select();
                        document.execCommand("copy");
                        document.body.removeChild(dummy);
                        alert("旅程編碼已複製！"); 
                    },
                    closeModals: () => { showAddEvent.value = false; showAddExpense.value = false; },
                    
                    claimIdentity: (name) => {
                        myIdentity.value = name;
                        localStorage.setItem('myIdentity', name);
                    },

                    createNewTrip: async () => {
                        if(!wizardData.destination) return;
                        loading.value = true;
                        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                        const finalTravelers = wizardTravelers.value.filter(t=>t.trim());
                        if(finalTravelers.length === 0) finalTravelers.push('我');
                        await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', code), { 
                            ...wizardData, 
                            travelers: finalTravelers, 
                            creator: user.value?.uid || 'anon' 
                        });
                        currentTripId.value = code; localStorage.setItem('lastTripId', code); connectToTrip(code);
                    },

                    joinTrip: async () => {
                        const cleanCode = joinCode.value.trim().toUpperCase();
                        if(!cleanCode) return; loading.value = true;
                        const s = await getDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', cleanCode));
                        if(s.exists()){ currentTripId.value = cleanCode; localStorage.setItem('lastTripId', cleanCode); connectToTrip(cleanCode); }
                        else { alert("找不到該旅程編碼！"); loading.value = false; }
                    },

                    getColorClass: (i) => AVATAR_COLORS[i % AVATAR_COLORS.length],
                    getColorHex: (i) => HEX_COLORS[i % HEX_COLORS.length],
                    tabs: [
                        { id: 'itinerary', name: '行程', icon: 'fa-solid fa-map' },
                        { id: 'map', name: '地圖', icon: 'fa-solid fa-location-dot' },
                        { id: 'split', name: '分帳', icon: 'fa-solid fa-calculator' },
                        { id: 'check', name: '行李', icon: 'fa-solid fa-suitcase' }
                    ]
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
