<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅遊助手 - 旗艦智慧版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            'bg': '#F2F2F7',
                            'primary': '#007AFF',
                            'text': '#1C1C1E',
                            'success': '#34C759',
                            'danger': '#FF3B30',
                            'warning': '#FF9500'
                        }
                    },
                    borderRadius: { 'ios': '20px' }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none !important; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .tab-bar { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .date-chip-active { background-color: #007AFF; color: white; transform: scale(1.05); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .rounded-ios { border-radius: 20px !important; }
        
        #startup-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F2F2F7; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="startup-loader">
        <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-xs font-bold text-gray-400">正在檢查旅程連線...</p>
    </div>

    <div id="app" v-cloak class="h-screen w-full relative overflow-hidden flex flex-col">
        
        <!-- 載入中遮罩 -->
        <div v-if="loading" class="fixed inset-0 z-[1000] bg-white/80 backdrop-blur-md flex flex-col items-center justify-center">
            <div class="w-10 h-10 border-4 border-theme-primary border-t-transparent rounded-full animate-spin mb-4"></div>
        </div>

        <!-- 初始畫面 -->
        <transition name="fade">
            <div v-if="(!currentTripId || (currentTripId && !myIdentity)) && !loading" class="fixed inset-0 z-[999] bg-white flex flex-col">
                
                <template v-if="!currentTripId">
                    <div class="pt-20 px-8 pb-4">
                        <h1 class="text-4xl font-black text-theme-text mb-2">旅遊助手 {{ wizardData.flag }}</h1>
                        <p class="text-gray-400 text-sm font-bold">與旅伴同步行程與帳單。</p>
                    </div>

                    <div class="flex-grow flex flex-col px-8 space-y-6 overflow-y-auto hide-scrollbar pb-10">
                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <button @click="initType = 'create'" :class="['p-6 rounded-ios border-2 text-center transition-all', initType === 'create' ? 'border-theme-primary bg-blue-50' : 'border-gray-100']">
                                <i class="fa-solid fa-plane-departure text-xl mb-2" :class="initType === 'create' ? 'text-theme-primary' : 'text-gray-300'"></i>
                                <h3 class="font-black text-sm">我要開團</h3>
                            </button>
                            <button @click="initType = 'join'" :class="['p-6 rounded-ios border-2 text-center transition-all', initType === 'join' ? 'border-theme-primary bg-blue-50' : 'border-gray-100']">
                                <i class="fa-solid fa-users text-xl mb-2" :class="initType === 'join' ? 'text-theme-primary' : 'text-gray-300'"></i>
                                <h3 class="font-black text-sm">我要跟團</h3>
                            </button>
                        </div>

                        <!-- 開團嚮導 -->
                        <div v-if="initType === 'create'" class="space-y-6 pt-2">
                            <div class="space-y-4">
                                <label class="text-[10px] font-black text-theme-primary uppercase tracking-widest">行程設定</label>
                                <div class="relative">
                                    <input v-model="wizardData.destination" @input="detectLocationInfo" type="text" placeholder="輸入目的地 (如: 東京、曼谷、倫敦)" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                                    <span class="absolute right-4 top-4 text-xl">{{ wizardData.flag }}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div class="bg-gray-50 p-3 rounded-ios">
                                        <p class="text-[8px] font-bold text-gray-400 mb-1">幣別</p>
                                        <input v-model="wizardData.currency" type="text" class="w-full bg-transparent font-black text-sm outline-none uppercase">
                                    </div>
                                    <div class="bg-gray-50 p-3 rounded-ios">
                                        <p class="text-[8px] font-bold text-gray-400 mb-1">匯率 (1幣 = ? TWD)</p>
                                        <input v-model.number="wizardData.rate" type="number" step="0.001" class="w-full bg-transparent font-black text-sm outline-none">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <input v-model="wizardData.startDate" type="date" class="bg-gray-50 p-3 rounded-ios font-bold text-xs outline-none">
                                    <input v-model="wizardData.endDate" type="date" class="bg-gray-50 p-3 rounded-ios font-bold text-xs outline-none">
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="flex justify-between items-center">
                                    <label class="text-[10px] font-black text-theme-primary uppercase tracking-widest">旅伴名單</label>
                                    <button @click="wizardTravelers.push('')" class="text-theme-primary text-[10px] font-black">+ 新增</button>
                                </div>
                                <div class="space-y-2">
                                    <div v-for="(name, idx) in wizardTravelers" :key="idx" class="flex items-center space-x-2">
                                        <div :class="['w-8 h-8 rounded-full flex items-center justify-center text-white text-[10px] font-black', getColorClass(idx)]">
                                            {{ wizardTravelers[idx].charAt(0) || '?' }}
                                        </div>
                                        <input v-model="wizardTravelers[idx]" type="text" placeholder="姓名" class="flex-grow bg-gray-50 p-3 rounded-ios font-bold text-sm outline-none">
                                        <button v-if="wizardTravelers.length > 1" @click="wizardTravelers.splice(idx, 1)" class="text-gray-300 px-2"><i class="fa-solid fa-minus"></i></button>
                                    </div>
                                </div>
                            </div>
                            
                            <button @click="createNewTrip" :disabled="!isCreateValid" class="w-full py-5 bg-theme-primary text-white rounded-ios font-black shadow-lg disabled:opacity-30">立即開團</button>
                        </div>

                        <div v-if="initType === 'join'" class="space-y-6 pt-10 text-center">
                            <div class="bg-gray-50 p-8 rounded-ios border-2 border-dashed border-gray-200">
                                <p class="text-xs font-bold text-gray-400 mb-4">輸入 6 位數旅程代碼</p>
                                <input v-model="joinCode" type="text" maxlength="6" placeholder="XXXXXX" class="w-full bg-transparent font-black text-4xl text-center tracking-[0.4em] outline-none placeholder-gray-200 uppercase">
                            </div>
                            <button @click="joinExistingTrip" :disabled="joinCode.length < 6" class="w-full py-5 bg-theme-text text-white rounded-ios font-black shadow-lg disabled:opacity-30">加入旅程</button>
                        </div>
                    </div>
                </template>

                <template v-else>
                    <div class="pt-20 px-8 pb-4">
                        <h1 class="text-3xl font-black text-theme-text mb-2">認領身分</h1>
                        <p class="text-gray-400 text-sm font-bold">你是哪位旅伴？這將用於自動記帳。</p>
                    </div>
                    <div class="flex-grow px-8 py-10 grid grid-cols-2 gap-4 overflow-y-auto">
                        <button v-for="(name, idx) in tripConfig.travelers" :key="name" 
                                @click="claimIdentity(name)"
                                class="flex flex-col items-center justify-center p-6 bg-gray-50 rounded-ios border-2 border-transparent hover:border-theme-primary transition-all">
                            <div :class="['w-16 h-16 rounded-full flex items-center justify-center text-white text-xl font-black mb-3 shadow-sm', getColorClass(idx)]">
                                {{ name.charAt(0) }}
                            </div>
                            <span class="font-black text-theme-text">{{ name }}</span>
                        </button>
                    </div>
                    <div class="p-8 text-center">
                        <button @click="logoutTrip" class="text-xs font-bold text-gray-300 underline">返回首頁</button>
                    </div>
                </template>
            </div>
        </transition>

        <!-- 主界面 -->
        <template v-if="currentTripId && myIdentity && !loading">
            <main class="flex-grow relative z-10 overflow-hidden flex flex-col">
                <!-- 行程規劃 -->
                <section v-if="activeTab === 'itinerary'" class="h-full flex flex-col bg-theme-bg">
                    <div class="pt-14 pb-4 bg-white shadow-sm z-20">
                        <div class="px-6 flex justify-between items-end mb-4">
                            <div>
                                <h2 class="text-xl font-black text-theme-text">{{ tripConfig.destination }} {{ tripConfig.flag }}</h2>
                                <div @click="copyTripCode" class="inline-flex items-center space-x-1 bg-gray-100 px-2 py-1 rounded-md text-[10px] font-bold text-gray-500 cursor-pointer active:bg-gray-200">
                                    <span>代碼: {{ currentTripId }}</span>
                                    <i class="fa-solid fa-copy"></i>
                                </div>
                            </div>
                            <button @click="showAddEvent = true" class="w-10 h-10 bg-theme-primary text-white rounded-full flex items-center justify-center shadow-lg">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div class="flex space-x-3 overflow-x-auto px-6 pb-2 hide-scrollbar">
                            <button v-for="day in dateSequence" :key="day.dateStr" 
                                    @click="selectedDateStr = day.dateStr"
                                    :class="['flex-shrink-0 w-14 h-16 rounded-ios flex flex-col items-center justify-center transition-all', selectedDateStr === day.dateStr ? 'date-chip-active shadow-md' : 'bg-gray-50 text-gray-400']">
                                <span class="text-[9px] font-black uppercase mb-1">{{ day.weekday }}</span>
                                <span class="text-base font-black">{{ day.dayNum }}</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto hide-scrollbar px-6 pt-4 pb-32">
                        <div v-for="(item, idx) in filteredItinerary" :key="item.id" class="relative pl-11 py-1 mb-4">
                            <div class="absolute left-0 w-8 h-8 rounded-full bg-white shadow-sm border-2 border-theme-primary flex items-center justify-center text-[10px] font-black text-theme-primary translate-y-3 z-10">{{ idx + 1 }}</div>
                            <div class="p-5 rounded-ios bg-white shadow-sm flex justify-between items-start">
                                <div @click="openGoogleMap(item.location)" class="flex-grow cursor-pointer">
                                    <span class="text-[10px] font-black text-theme-primary uppercase">{{ item.time }}</span>
                                    <h4 class="font-bold text-theme-text text-base leading-tight">{{ item.location }}</h4>
                                </div>
                                <button @click="deleteEvent(item.id)" class="text-gray-200"><i class="fa-solid fa-circle-xmark text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 分帳中心 -->
                <section v-if="activeTab === 'split'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm flex justify-between items-center">
                        <h2 class="text-2xl font-black text-theme-text">結算中心</h2>
                        <button @click="showAddExpense = true" class="px-5 py-2.5 bg-theme-primary text-white rounded-full text-xs font-black shadow-md">+ 記帳</button>
                    </div>
                    <div class="flex-grow overflow-y-auto p-6 pb-32 hide-scrollbar">
                        <div class="bg-theme-text p-6 rounded-ios shadow-lg mb-6 text-white relative overflow-hidden">
                            <i class="fa-solid fa-coins absolute -right-4 -bottom-4 text-7xl opacity-10"></i>
                            <p class="text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-widest">總支出 ({{ tripConfig.currency }})</p>
                            <h3 class="text-3xl font-black">{{ tripConfig.currency }} {{ totalExpenseAmount.toLocaleString() }}</h3>
                            <p class="text-sm font-black text-theme-success mt-1">約 NT$ {{ Math.round(totalExpenseAmount * (tripConfig.rate || 1)).toLocaleString() }}</p>
                            <p class="text-[8px] text-gray-500 mt-2">目前匯率：1 {{ tripConfig.currency }} = {{ tripConfig.rate }} TWD</p>
                        </div>

                        <h3 class="text-[11px] font-black text-gray-400 uppercase mb-3 px-1">收支餘額 (NT$)</h3>
                        <div class="bg-white rounded-ios shadow-sm divide-y divide-gray-50 overflow-hidden mb-6">
                            <div v-for="(bal, name) in balances" :key="name" class="p-4 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div :class="['w-8 h-8 rounded-full flex items-center justify-center text-white text-[10px] font-black', getColorClassByName(name)]">
                                        {{ name.charAt(0) }}
                                    </div>
                                    <span class="text-sm font-bold text-theme-text">{{ name }} <span v-if="name === myIdentity" class="text-[9px] bg-gray-100 px-1 rounded text-gray-400">我</span></span>
                                </div>
                                <div class="text-right">
                                    <p :class="['text-sm font-black', bal >= 0 ? 'text-theme-success' : 'text-theme-danger']">
                                        {{ bal >= 0 ? '+' : '' }}{{ Math.round(bal * (tripConfig.rate || 1)) }}
                                    </p>
                                    <p class="text-[9px] text-gray-300">{{ bal >= 0 ? '應收' : '應付' }}</p>
                                </div>
                            </div>
                        </div>

                        <h3 class="text-[11px] font-black text-gray-400 uppercase mb-3 px-1">消費紀錄</h3>
                        <div v-for="ex in expenses" :key="ex.id" class="bg-white p-4 rounded-ios mb-3 shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center space-x-2">
                                    <div class="w-8 h-8 bg-gray-50 rounded-ios flex items-center justify-center text-gray-400 text-xs">
                                        <i :class="['fa-solid', getExpIcon(ex.category)]"></i>
                                    </div>
                                    <h4 class="font-bold text-sm">{{ ex.title }}</h4>
                                </div>
                                <button @click="deleteExpense(ex.id)" class="text-gray-200"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                            <div class="flex justify-between items-end">
                                <div class="text-[10px] text-gray-400">
                                    <span class="font-black text-theme-text">{{ ex.payer }}</span> 付款
                                    <div class="mt-1 flex flex-wrap gap-1">
                                        <span v-for="m in ex.splitAmong" :key="m" class="bg-gray-50 px-1.5 py-0.5 rounded text-[8px] border border-gray-100">{{ m }}</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-sm font-black text-theme-primary">{{ ex.amount }} {{ tripConfig.currency }}</p>
                                    <p class="text-[9px] text-gray-300">NT$ {{ Math.round(ex.amount * (tripConfig.rate || 1)) }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 地圖 -->
                <section v-if="activeTab === 'map'" class="h-full flex flex-col bg-theme-bg">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm"><h2 class="text-2xl font-black text-theme-text">景點指南</h2></div>
                    <div class="p-6 space-y-4 flex-grow overflow-y-auto pb-32">
                        <div v-for="item in filteredItinerary" @click="openGoogleMap(item.location)" class="bg-white p-5 rounded-ios shadow-sm flex items-center justify-between active:scale-95 transition-all">
                            <h4 class="font-black text-sm">{{ item.location }}</h4>
                            <i class="fa-solid fa-location-dot text-theme-primary"></i>
                        </div>
                    </div>
                </section>

                <!-- 行李清單 -->
                <section v-if="activeTab === 'check'" class="h-full bg-theme-bg flex flex-col">
                    <div class="pt-14 px-6 pb-6 bg-white shadow-sm"><h2 class="text-2xl font-black text-theme-text">行李清單</h2></div>
                    <div class="p-6 space-y-6 flex-grow overflow-y-auto pb-32">
                        <div v-for="cat in checklistCategories" :key="cat">
                            <div class="flex justify-between mb-2 px-1">
                                <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{{ cat }}</h3>
                                <button @click="openAddItem(cat)" class="text-theme-primary text-[10px] font-black">+ 新增</button>
                            </div>
                            <div class="bg-white rounded-ios shadow-sm overflow-hidden">
                                <div v-for="item in checklist.filter(i=>i.category === cat)" @click="toggleCheck(item)" class="p-4 border-b border-gray-50 flex items-center last:border-0">
                                    <div :class="['w-5 h-5 rounded-full border-2 flex items-center justify-center mr-3', item.checked ? 'bg-theme-success border-theme-success' : 'border-gray-100']">
                                        <i v-if="item.checked" class="fa-solid fa-check text-white text-[8px]"></i>
                                    </div>
                                    <span :class="['text-xs font-bold flex-grow', item.checked ? 'text-gray-300 line-through' : 'text-theme-text']">{{ item.name }}</span>
                                    <button @click.stop="removeItem(item.id)" class="text-gray-200"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <!-- 底部選單 -->
            <nav class="fixed bottom-0 left-0 right-0 tab-bar border-t border-gray-100 px-6 pt-3 pb-safe z-[100]">
                <div class="flex justify-between items-center max-w-lg mx-auto pb-4">
                    <button v-for="tab in tabs" @click="activeTab = tab.id" :class="['flex flex-col items-center space-y-1', activeTab === tab.id ? 'text-theme-primary' : 'text-gray-400']">
                        <i :class="['text-lg', tab.icon]"></i>
                        <span class="text-[9px] font-black uppercase tracking-tighter">{{ tab.name }}</span>
                    </button>
                </div>
            </nav>
        </template>

        <!-- 彈窗 -->
        <transition name="slide-up">
            <div v-if="showAddEvent || showAddExpense || showAddItemModal" class="fixed inset-0 bg-black/40 z-[200] flex items-end" @click.self="closeModals">
                <div class="bg-white w-full rounded-t-ios p-8 pb-12 shadow-2xl max-h-[90vh] overflow-y-auto">
                    <!-- 新增行程 -->
                    <div v-if="showAddEvent" class="space-y-4">
                        <h3 class="font-black text-lg">新增行程</h3>
                        <input v-model="newEvent.location" type="text" placeholder="輸入地點" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <input v-model="newEvent.time" type="time" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <button @click="addEvent" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black">儲存</button>
                    </div>

                    <!-- 記帳 -->
                    <div v-if="showAddExpense" class="space-y-4">
                        <h3 class="font-black text-lg">新增消費 ({{ tripConfig.currency }})</h3>
                        <div class="flex items-center space-x-2">
                             <input v-model="newExpense.amount" type="number" placeholder="0" class="flex-grow bg-gray-50 p-5 rounded-ios font-black text-3xl outline-none">
                             <div class="text-center px-4 py-2 bg-blue-50 rounded-ios">
                                 <p class="text-[8px] font-black text-theme-primary uppercase">約合 NT$</p>
                                 <p class="text-sm font-black text-theme-text">{{ Math.round(newExpense.amount * (tripConfig.rate || 1)) }}</p>
                             </div>
                        </div>
                        <input v-model="newExpense.title" type="text" placeholder="項目名稱 (如: 飛機餐)" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <div class="grid grid-cols-2 gap-3">
                            <select v-model="newExpense.payer" class="bg-gray-50 p-4 rounded-ios font-bold outline-none text-sm">
                                <option v-for="p in tripConfig.travelers" :key="p" :value="p">{{ p }} 付款</option>
                            </select>
                            <select v-model="newExpense.category" class="bg-gray-50 p-4 rounded-ios font-bold outline-none text-sm">
                                <option value="餐飲">餐飲</option><option value="交通">交通</option><option value="購物">購物</option><option value="住宿">住宿</option>
                            </select>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-ios">
                            <div class="flex justify-between mb-3 px-1">
                                <label class="text-[10px] font-black text-gray-400 uppercase">分攤對象</label>
                                <button @click="toggleAllSplit" class="text-[10px] font-black text-theme-primary">全選/反選</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button v-for="name in tripConfig.travelers" :key="name" 
                                     @click="toggleSplitMember(name)"
                                     :class="['p-3 rounded-lg flex items-center justify-between border-2 transition-all', newExpense.splitAmong.includes(name) ? 'border-theme-primary bg-white shadow-sm' : 'border-transparent text-gray-300']">
                                    <span class="text-xs font-bold">{{ name }}</span>
                                    <i v-if="newExpense.splitAmong.includes(name)" class="fa-solid fa-check-circle text-theme-primary"></i>
                                </button>
                            </div>
                        </div>
                        <button @click="addExpense" :disabled="!newExpense.amount || newExpense.splitAmong.length === 0" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black shadow-lg">完成</button>
                    </div>

                    <div v-if="showAddItemModal" class="space-y-4">
                        <h3 class="font-black text-lg">新增行李</h3>
                        <input v-model="newItemName" @keyup.enter="confirmAddItem" type="text" class="w-full bg-gray-50 p-4 rounded-ios font-bold outline-none">
                        <button @click="confirmAddItem" class="w-full bg-theme-primary text-white py-4 rounded-ios font-black">確定</button>
                    </div>
                </div>
            </div>
        </transition>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6fV7gHlQMNYnGsiFyzMTYXrGpU93X96k",
            authDomain: "my-travel-app-eff55.firebaseapp.com",
            projectId: "my-travel-app-eff55",
            storageBucket: "my-travel-app-eff55.firebasestorage.app",
            messagingSenderId: "956233286029",
            appId: "1:956233286029:web:ae064b514f9246c7587dc4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "travel-collab-v3";

        const { createApp, ref, computed, reactive, onMounted } = Vue;
        const AVATAR_COLORS = ['bg-red-400', 'bg-blue-400', 'bg-green-400', 'bg-orange-400', 'bg-purple-400'];

        createApp({
            setup() {
                const loading = ref(true);
                const initType = ref('create'); 
                const joinCode = ref('');
                const currentTripId = ref(localStorage.getItem('lastTripId') || '');
                const myIdentity = ref(localStorage.getItem('myIdentity') || '');
                
                const wizardData = reactive({ 
                    destination: '', 
                    startDate: new Date().toISOString().split('T')[0], 
                    endDate: new Date().toISOString().split('T')[0], 
                    currency: 'TWD', 
                    rate: 1, 
                    flag: '✈️' 
                });
                const wizardTravelers = ref(['我']);
                
                const tripConfig = ref({ travelers: [], rate: 1, currency: 'TWD' });
                const itinerary = ref([]);
                const expenses = ref([]);
                const checklist = ref([]);
                
                const activeTab = ref('itinerary');
                const selectedDateStr = ref('');
                const showAddEvent = ref(false);
                const showAddExpense = ref(false);
                const showAddItemModal = ref(false);
                const currentAddCat = ref('');
                const newItemName = ref('');

                const newEvent = ref({ location: '', time: '09:00' });
                const newExpense = reactive({ amount: '', title: '', payer: '', category: '餐飲', splitAmong: [] });

                const getTripDoc = (tripId) => doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripId);
                const getSubColl = (tripId, sub) => collection(db, 'artifacts', APP_ID, 'public', 'data', 'trips', tripId, sub);

                const connectToTrip = (tripId) => {
                    loading.value = true;
                    const docRef = getTripDoc(tripId);
                    
                    onSnapshot(docRef, (s) => {
                        if(s.exists()){
                            tripConfig.value = s.data();
                            if(!selectedDateStr.value) selectedDateStr.value = tripConfig.value.startDate;
                            if(!newExpense.payer) newExpense.payer = myIdentity.value || tripConfig.value.travelers[0];
                            if(newExpense.splitAmong.length === 0) newExpense.splitAmong = [...tripConfig.value.travelers];
                        }
                        loading.value = false;
                        document.getElementById('startup-loader').style.display = 'none';
                    }, (err) => console.error("Config load error:", err));

                    onSnapshot(getSubColl(tripId, 'events'), (s) => itinerary.value = s.docs.map(d=>({id:d.id, ...d.data()})), (err) => console.error("Events error:", err));
                    onSnapshot(getSubColl(tripId, 'expenses'), (s) => expenses.value = s.docs.map(d=>({id:d.id, ...d.data()})), (err) => console.error("Expenses error:", err));
                    onSnapshot(getSubColl(tripId, 'checklist'), (s) => checklist.value = s.docs.map(d=>({id:d.id, ...d.data()})), (err) => console.error("Checklist error:", err));
                };

                onMounted(async () => {
                    await signInAnonymously(auth);
                    if(currentTripId.value) connectToTrip(currentTripId.value);
                    else {
                        loading.value = false;
                        document.getElementById('startup-loader').style.display = 'none';
                    }
                });

                const detectLocationInfo = () => {
                    const locs = [
                        { keys: ['東京','大阪','沖繩','北海道','福岡','日本','名古屋','京都'], cur: 'JPY', rate: 0.22, flag: '🇯🇵' },
                        { keys: ['韓國','首爾','釜山','濟州'], cur: 'KRW', rate: 0.024, flag: '🇰🇷' },
                        { keys: ['泰國','曼谷','清邁','普吉'], cur: 'THB', rate: 0.92, flag: '🇹🇭' },
                        { keys: ['越南','胡志明','河內','峴港'], cur: 'VND', rate: 0.0013, flag: '🇻🇳' },
                        { keys: ['香港'], cur: 'HKD', rate: 4.1, flag: '🇭🇰' },
                        { keys: ['澳門'], cur: 'MOP', rate: 4.0, flag: '🇲🇴' },
                        { keys: ['新加坡'], cur: 'SGD', rate: 24.5, flag: '🇸🇬' },
                        { keys: ['馬來西亞','吉隆坡'], cur: 'MYR', rate: 7.0, flag: '🇲🇾' },
                        { keys: ['美國','紐約','洛杉磯','舊金山'], cur: 'USD', rate: 32.0, flag: '🇺🇸' },
                        { keys: ['歐洲','英國','倫敦','法國','巴黎','德國','義大利'], cur: 'EUR', rate: 35.0, flag: '🇪🇺' },
                        { keys: ['澳洲','雪梨','墨爾本'], cur: 'AUD', rate: 21.5, flag: '🇦🇺' }
                    ];
                    const found = locs.find(l => l.keys.some(k => wizardData.destination.includes(k)));
                    if(found) { 
                        wizardData.currency = found.cur; 
                        wizardData.rate = found.rate; 
                        wizardData.flag = found.flag; 
                    } else {
                        wizardData.currency = 'TWD';
                        wizardData.rate = 1;
                        wizardData.flag = '✈️';
                    }
                };

                const createNewTrip = async () => {
                    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                    const travelers = wizardTravelers.value.filter(t=>t.trim());
                    const data = { ...wizardData, travelers, creator: auth.currentUser.uid };
                    await setDoc(getTripDoc(code), data);
                    currentTripId.value = code;
                    localStorage.setItem('lastTripId', code);
                    connectToTrip(code);
                    confetti();
                };

                const joinExistingTrip = async () => {
                    const code = joinCode.value.toUpperCase();
                    const s = await getDoc(getTripDoc(code));
                    if(s.exists()) {
                        currentTripId.value = code;
                        localStorage.setItem('lastTripId', code);
                        connectToTrip(code);
                    } else alert("找不到旅程代碼。");
                };

                const claimIdentity = (name) => {
                    myIdentity.value = name;
                    localStorage.setItem('myIdentity', name);
                    newExpense.payer = name;
                };

                const logoutTrip = () => {
                    localStorage.clear();
                    window.location.reload();
                };

                return {
                    loading, initType, joinCode, currentTripId, myIdentity, wizardData, wizardTravelers, tripConfig, activeTab, selectedDateStr,
                    itinerary, expenses, checklist, showAddEvent, showAddExpense, showAddItemModal, currentAddCat, newItemName, newEvent, newExpense,
                    isCreateValid: computed(() => wizardData.destination && wizardTravelers.value.filter(t=>t.trim()).length > 0),
                    checklistCategories: ['行前準備', '電子產品', '日常用品', '證件文件'],
                    detectLocationInfo, createNewTrip, joinExistingTrip, claimIdentity, logoutTrip,
                    dateSequence: computed(() => {
                        const start = new Date(tripConfig.value.startDate || wizardData.startDate);
                        const end = new Date(tripConfig.value.endDate || wizardData.endDate);
                        const list = []; const temp = new Date(start);
                        const week = ['日','一','二','三','四','五','六'];
                        while(temp <= end && list.length < 31) {
                            list.push({ dateStr: temp.toISOString().split('T')[0], dayNum: temp.getDate(), weekday: week[temp.getDay()] });
                            temp.setDate(temp.getDate() + 1);
                        }
                        return list;
                    }),
                    filteredItinerary: computed(() => itinerary.value.filter(i => i.dateStr === selectedDateStr.value).sort((a,b)=>a.time.localeCompare(b.time))),
                    totalExpenseAmount: computed(() => expenses.value.reduce((s, e) => s + (Number(e.amount) || 0), 0)),
                    balances: computed(() => {
                        const res = {}; (tripConfig.value.travelers || []).forEach(n => res[n] = 0);
                        expenses.value.forEach(ex => {
                            const amt = Number(ex.amount) || 0;
                            const members = ex.splitAmong || [];
                            const share = amt / Math.max(members.length, 1);
                            if(res.hasOwnProperty(ex.payer)) res[ex.payer] += amt;
                            members.forEach(n => { if(res.hasOwnProperty(n)) res[n] -= share; });
                        });
                        return res;
                    }),
                    toggleSplitMember: (n) => {
                        const idx = newExpense.splitAmong.indexOf(n);
                        if(idx > -1) newExpense.splitAmong.splice(idx, 1);
                        else newExpense.splitAmong.push(n);
                    },
                    toggleAllSplit: () => {
                        if(newExpense.splitAmong.length === tripConfig.value.travelers.length) newExpense.splitAmong = [];
                        else newExpense.splitAmong = [...tripConfig.value.travelers];
                    },
                    addEvent: async () => {
                        await addDoc(getSubColl(currentTripId.value, 'events'), { ...newEvent.value, dateStr: selectedDateStr.value });
                        showAddEvent.value = false;
                        newEvent.value = { location: '', time: '09:00' };
                    },
                    addExpense: async () => {
                        await addDoc(getSubColl(currentTripId.value, 'expenses'), { ...newExpense });
                        showAddExpense.value = false;
                        Object.assign(newExpense, { amount: '', title: '', splitAmong: [...tripConfig.value.travelers] });
                    },
                    deleteEvent: (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'events', id)),
                    deleteExpense: (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'expenses', id)),
                    toggleCheck: (item) => updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'checklist', item.id), { checked: !item.checked }),
                    removeItem: (id) => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trips', currentTripId.value, 'checklist', id)),
                    openAddItem: (cat) => { currentAddCat.value = cat; newItemName.value = ''; showAddItemModal.value = true; },
                    confirmAddItem: async () => {
                        await addDoc(getSubColl(currentTripId.value, 'checklist'), { category: currentAddCat.value, name: newItemName.value, checked: false });
                        showAddItemModal.value = false;
                    },
                    closeModals: () => { showAddEvent.value = false; showAddExpense.value = false; showAddItemModal.value = false; },
                    copyTripCode: () => {
                        const el = document.createElement('textarea'); el.value = currentTripId.value; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                        alert("代碼已複製！快分享給旅伴吧！");
                    },
                    getColorClass: (i) => AVATAR_COLORS[i % AVATAR_COLORS.length],
                    getColorClassByName: (name) => AVATAR_COLORS[(tripConfig.value.travelers || []).indexOf(name) % AVATAR_COLORS.length] || 'bg-gray-400',
                    getExpIcon: (c) => ({'餐飲':'fa-utensils','交通':'fa-train','購物':'fa-bag-shopping','住宿':'fa-bed'}[c] || 'fa-tag'),
                    openGoogleMap: (l) => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l)}`),
                    tabs: [
                        { id: 'itinerary', name: '行程', icon: 'fa-solid fa-calendar-check' },
                        { id: 'map', name: '導航', icon: 'fa-solid fa-map-location-dot' },
                        { id: 'split', name: '分帳', icon: 'fa-solid fa-wallet' },
                        { id: 'check', name: '行李', icon: 'fa-solid fa-list-check' }
                    ]
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
